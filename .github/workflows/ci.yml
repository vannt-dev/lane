name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] && files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename'); then
            printf '%s\n' "$files"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -Evq '^([^/]*\.md|docs/.*|LICENSE)$'; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
  commits:
    uses: vannt-dev/repokeeper/.github/workflows/commitlint.yml@v0
  node:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    uses: vannt-dev/repokeeper/.github/workflows/stack-node.yml@v0
    with:
      node-versions: '["22.18","24"]'
      os: '["ubuntu-latest","windows-latest","macos-latest"]'
      package-manager: npm
      install-command: npm ci
      cache: npm
      scripts: '["typecheck","test","build"]'
  # The jj tests skip without jj; here they run against a pinned jj release.
  jj:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JJ_VERSION: 0.47.1
      JJ_SHA256: d4b657f622ee50929c8916466dfa3d6a6c17a0a32b50e7b2c793707ec9ebcad7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install jj
        run: |
          file="jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/$file"
          echo "${JJ_SHA256}  $RUNNER_TEMP/$file" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/jj"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/jj" ./jj
          echo "$RUNNER_TEMP/jj" >> "$GITHUB_PATH"
      - run: jj --version
      - run: node --import ./test/setup.ts --test test/jj.test.ts
  result:
    name: CI result
    if: always()
    needs:
      - node
      - jj
      - commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
