# Managed by repokeeper (https://github.com/vannt-dev/repokeeper). Edits are reported by `repokeeper check`. Keys and jobs you add yourself are left alone.

name: release
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  release-pr-ci:
    needs: release
    if: ${{ needs.release.outputs.pr_branch != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.release.outputs.pr_branch }}
        run: |
          for _ in 1 2 3 4 5 6; do
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$BRANCH&event=pull_request&status=action_required" --jq '.workflow_runs[].id')
            [ -n "$ids" ] && break
            sleep 10
          done
          if [ -z "$ids" ]; then echo "::notice::no held runs for $BRANCH"; fi
          for id in $ids; do gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"; done
  release:
    uses: vannt-dev/repokeeper/.github/workflows/release-please.yml@v0
    permissions:
      contents: write
      pull-requests: write
      issues: write
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
  # Added by hand (repokeeper leaves it alone): publishes the release to npm as @vannt-dev/lane
  # through trusted publishing (npmjs.com trusts this repository and this workflow; no token secret).
  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm publish --provenance --access public
